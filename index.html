<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Pages</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 640px; margin: 0 auto; padding: 60px 20px; text-align: center; color: #1F2937; background: #F8FAFC; }
  @media (prefers-color-scheme: dark) { body { color: #F1F5F9; background: #0F172A; } .card { background: #1E293B !important; border-color: #334155 !important; } a.btn { background: #3B82F6 !important; } }
  h1 { font-size: 28px; margin-bottom: 4px; }
  .tagline { color: #6B7280; margin-bottom: 36px; }
  .card { background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 14px; padding: 18px 20px; margin-bottom: 12px; text-align: left; display: flex; align-items: center; justify-content: space-between; }
  a.btn { display: inline-block; background: #2563EB; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 14px; }
  a.btn:hover { opacity: 0.9; }
  .appname { font-weight: 700; }
  footer { margin-top: 48px; font-size: 12px; color: #6B7280; }
</style>
</head>
<body>
  <h1>🔒 Privacy Pages</h1>
  <p class="tagline">Privacy policies &amp; terms of service for apps published here</p>

  <div class="card">
    <span class="appname">📱 FinCalc Pro</span>
    <a class="btn" href="./fincalcpro/">View Pages</a>
  </div>

  <footer>More apps will be listed here as they're published.</footer>
</body>
</html>
